[package]
name = "blog_api"
version = "0.1.0"
edition = "2024"

[dependencies]
rusqlite = { version = "0.39.0", features = ["bundled"] }
bytes = "1.11.0"
http-body-util = "0.1.3"
hyper = { version = "1.8.1", features = ["server","http1"] }
rand = "0.10.1"
smol = "2.0.2"
smol-hyper = "0.1.1"
json = "0.12.4"
r2d2 = "0.8.10"
r2d2_sqlite = "0.33.0"
async-channel = "2.5.0"
async-executor = "1.13.3"
easy-parallel = "3.3.1"
futures-lite = "2.6.1"
urlencoding = "2.1.3"
hotwatch = "0.5.0"
async-broadcast = "0.7.2"
heapless = "0.9.2"
pulldown-cmark-escape = { version = "0.11.0", features = ["simd"] }
async-stream-lite = "0.2.0"
quick-error = "2.0.1"
nano-get = { version = "0.3.0", features = ["https"] }
